<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Tip calculator app</title>
    <!-- description -->
    <meta
      name="description"
      content="A FrontendMentor Javascript learning path challenge project solution."
    />
    <!-- space mono font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- local stylesheet -->
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main class="main">
      <h1 class="heading"><span>SPLI</span><span>TTER</span></h1>

      <form class="calculator">
        <label>
          <span>Bill</span>
          <input type="number" />
        </label>

        <fieldset>
          <legend>Select Tip %</legend>

          <label>
            <span>5%</span>
            <input name="tip" type="radio" />
          </label>
          <label>
            <span>10%</span>
            <input name="tip" type="radio" />
          </label>
          <label>
            <span>15%</span>
            <input name="tip" type="radio" />
          </label>
          <label>
            <span>25%</span>
            <input name="tip" type="radio" />
          </label>
          <label>
            <span>50%</span>
            <input name="tip" type="radio" />
          </label>
          <label>
            <span>Custom</span>
            <input name="tip" type="radio" />
            <input type="number" />
          </label>
        </fieldset>

        <label>
          <span>Number of People</span>
          <input type="number" />
        </label>

        <section>
          <div>
            <p>
              <strong>Tip Amount</strong>
              <span>/ person</span>
            </p>
            <output></output>
          </div>

          <div>
            <p>
              <strong>Total</strong>
              <span>/ person</span>
            </p>
            <output></output>
          </div>

          <button type="submit">Reset</button>
        </section>
      </form>
    </main>
  </body>
</html>
