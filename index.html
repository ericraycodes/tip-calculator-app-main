<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Tip calculator app</title>
    <!-- description -->
    <meta
      name="description"
      content="A FrontendMentor Javascript learning path challenge project solution."
    />
    <!-- space mono font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- local stylesheet -->
    <link rel="stylesheet" href="./styles/main.css" />
    <!-- external script -->
    <script defer src="./main.js"></script>
  </head>
  <body>
    <main class="app">
      <h1 class="heading"><span>SPLI</span><span>TTER</span></h1>

      <form class="calculator">
        <section class="input-controls">
          <label id="bill-input-label" class="input-number">
            <span class="label bill">Bill</span>
            <input id="bill-input" class="input" type="number" placeholder="0" />
          </label>

          <fieldset id="tip-selection" class="select-tip">
            <legend class="label">Select Tip %</legend>

            <label class="tip">
              <span>5%</span>
              <input class="radio-button" name="tip" type="radio" value="5" />
            </label>

            <label class="tip">
              <span>10%</span>
              <input class="radio-button" name="tip" type="radio" value="10" />
            </label>

            <label class="tip">
              <span>15%</span>
              <input class="radio-button" name="tip" type="radio" value="15" />
            </label>

            <label class="tip">
              <span>25%</span>
              <input class="radio-button" name="tip" type="radio" value="25" />
            </label>

            <label class="tip">
              <span>50%</span>
              <input class="radio-button" name="tip" type="radio" value="50" />
            </label>

            <label id="custom-tip-label" class="tip custom">
              <input
                id="custom-tip-radio"
                class="radio-button custom-radio"
                name="tip"
                type="radio"
                value="custom"
              />
              <input
                id="custom-tip"
                class="custom-tip-input"
                type="number"
                placeholder="Custom"
              />
            </label>
          </fieldset>

          <label id="number-of-people-input-label" class="input-number">
            <span class="label number-of-people">Number of People</span>
            <input 
              id="number-of-people-input" 
              class="input" 
              type="text" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              placeholder="0" 
            />
          </label>
        </section>

        <section class="calculation-result">
          <p class="amount-per-person">
            <span>
              <strong>Tip Amount</strong>
              / person
            </span>
            <output>0.00</output>
          </p>

          <p class="amount-per-person">
            <span>
              <strong>Total</strong>
              / person
            </span>
            <output>0.00</output>
          </p>

          <button class="reset" type="button">Reset</button>
        </section>
      </form>
    </main>
  </body>
</html>
